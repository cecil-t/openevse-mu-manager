<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker>
  </defs>
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#222">OpenEVSE MU Manager: how it fits together</text>

  <!-- Internet side -->
  <rect x="20" y="70" width="190" height="500" rx="14" fill="#f3f6fb" stroke="#9fb3cf" stroke-dasharray="6 4"/>
  <text x="115" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#34507a">Internet (public)</text>
  <!-- phone -->
  <rect x="85" y="125" width="60" height="100" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <rect x="93" y="137" width="44" height="72" rx="3" fill="#dfe8f5"/>
  <circle cx="115" cy="217" r="4" fill="#444"/>
  <text x="115" y="248" text-anchor="middle" font-size="13" fill="#222">Remote user</text>
  <text x="115" y="264" text-anchor="middle" font-size="12" fill="#555">phone, laptop, car</text>
  <!-- cloud -->
  <path d="M60,380 a30,30 0 0,1 30,-38 a38,38 0 0,1 68,-6 a28,28 0 0,1 28,40 a22,22 0 0,1 -10,40 h-104 a24,24 0 0,1 -12,-36 z" fill="#e8eef8" stroke="#7d93b8" stroke-width="2"/>
  <text x="118" y="392" text-anchor="middle" font-size="14" font-weight="600" fill="#34507a">Internet</text>
  <line x1="115" y1="272" x2="115" y2="332" stroke="#444" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="115" y="470" text-anchor="middle" font-size="12" fill="#555">Only HTTPS (443)</text>
  <text x="115" y="486" text-anchor="middle" font-size="12" fill="#555">is forwarded in.</text>
  <text x="115" y="502" text-anchor="middle" font-size="12" fill="#555">Leave it closed to keep</text>
  <text x="115" y="518" text-anchor="middle" font-size="12" fill="#555">the site home-only.</text>

  <!-- router -->
  <rect x="228" y="350" width="74" height="60" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="265" y="376" text-anchor="middle" font-size="12" font-weight="600" fill="#222">Router /</text>
  <text x="265" y="392" text-anchor="middle" font-size="12" font-weight="600" fill="#222">firewall</text>
  <line x1="190" y1="380" x2="226" y2="380" stroke="#444" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- Home network -->
  <rect x="320" y="70" width="660" height="510" rx="14" fill="#f6fbf4" stroke="#8fbf86" stroke-dasharray="6 4"/>
  <text x="650" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#2e6b25">Home network (private)</text>

  <!-- Server -->
  <rect x="340" y="112" width="360" height="450" rx="12" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <text x="520" y="136" text-anchor="middle" font-size="15" font-weight="700" fill="#222">Your server</text>

  <!-- Web server group -->
  <rect x="356" y="150" width="328" height="200" rx="10" fill="#eef4ff" stroke="#6f8fc4"/>
  <text x="370" y="170" font-size="12" font-weight="700" fill="#34507a">Web server with PHP</text>
  <text x="670" y="170" text-anchor="end" font-size="11" fill="#c62828" font-weight="700">PUBLIC (if forwarded)</text>
  <rect x="370" y="180" width="300" height="62" rx="8" fill="#fff" stroke="#1565c0" stroke-width="2"/>
  <text x="520" y="203" text-anchor="middle" font-size="15" font-weight="700" fill="#1565c0">Web app</text>
  <text x="520" y="222" text-anchor="middle" font-size="12" fill="#333">status, control, reports, settings, logins</text>
  <text x="520" y="236" text-anchor="middle" font-size="11" fill="#555">works on its own</text>
  <rect x="370" y="254" width="300" height="84" rx="8" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="520" y="277" text-anchor="middle" font-size="15" font-weight="700" fill="#2e7d32">Collector</text>
  <text x="520" y="296" text-anchor="middle" font-size="12" fill="#333">Emoncms receiver (/emoncms/)</text>
  <text x="520" y="312" text-anchor="middle" font-size="12" fill="#333">+ jobs every minute: logging, alerts,</text>
  <text x="520" y="327" text-anchor="middle" font-size="12" fill="#333">reminders, clock sync</text>

  <!-- database -->
  <ellipse cx="420" cy="380" rx="44" ry="10" fill="#fff8e1" stroke="#8d6e00"/>
  <path d="M376,380 v40 a44,10 0 0,0 88,0 v-40" fill="#fff8e1" stroke="#8d6e00"/>
  <text x="420" y="408" text-anchor="middle" font-size="12" font-weight="600" fill="#5d4600">SQLite</text>
  <text x="420" y="446" text-anchor="middle" font-size="11" fill="#555">units, sessions, users</text>
  <line x1="420" y1="340" x2="420" y2="368" stroke="#8d6e00" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Docker group -->
  <rect x="486" y="362" width="198" height="188" rx="10" fill="#fff4ec" stroke="#e08a4a"/>
  <text x="500" y="382" font-size="12" font-weight="700" fill="#a34a00">Docker</text>
  <text x="670" y="382" text-anchor="end" font-size="11" fill="#2e7d32" font-weight="700">HOME NETWORK ONLY</text>
  <rect x="500" y="392" width="170" height="62" rx="8" fill="#fff" stroke="#e65100" stroke-width="2"/>
  <text x="585" y="414" text-anchor="middle" font-size="15" font-weight="700" fill="#e65100">Broker</text>
  <text x="585" y="432" text-anchor="middle" font-size="12" fill="#333">Mosquitto MQTT</text>
  <text x="585" y="446" text-anchor="middle" font-size="11" fill="#555">port 1883</text>
  <rect x="500" y="476" width="170" height="62" rx="8" fill="#fff" stroke="#6a1b9a" stroke-width="2"/>
  <text x="585" y="498" text-anchor="middle" font-size="15" font-weight="700" fill="#6a1b9a">Coordinator</text>
  <text x="585" y="516" text-anchor="middle" font-size="12" fill="#333">load balancer</text>
  <text x="585" y="530" text-anchor="middle" font-size="11" fill="#555">no open ports</text>
  <line x1="585" y1="474" x2="585" y2="456" stroke="#6a1b9a" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- router to web app -->
  <path d="M302,370 H330 V211 H368" fill="none" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
  <text x="325" y="300" font-size="11" fill="#444" transform="rotate(-90 325 300)">HTTPS</text>

  <!-- Units -->
  <text x="870" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#222">OpenEVSE units</text>
  <text x="870" y="152" text-anchor="middle" font-size="11" fill="#555">on home WiFi</text>
  <g font-size="12" fill="#222" text-anchor="middle">
    <rect x="820" y="166" width="100" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="870" y="191" font-weight="600">Unit 1</text><text x="870" y="208" font-size="11" fill="#555">ESP8266 2.x</text>
    <rect x="820" y="236" width="100" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="870" y="261" font-weight="600">Unit 2</text><text x="870" y="278" font-size="11" fill="#555">ESP32 4.x/5.x</text>
    <rect x="820" y="306" width="100" height="56" rx="8" fill="#fff" stroke="#333" stroke-width="2"/><text x="870" y="331" font-weight="600">Unit 3 ...</text><text x="870" y="348" font-size="11" fill="#555">any mix</text>
  </g>
  <rect x="810" y="158" width="120" height="214" rx="10" fill="none" stroke="#777" stroke-dasharray="4 3"/>

  <!-- flows -->
  <path d="M808,190 H672" fill="none" stroke="#1565c0" stroke-width="2.2" marker-end="url(#b)" marker-start="url(#b)"/>
  <text x="740" y="183" text-anchor="middle" font-size="11" fill="#1565c0">HTTP API</text>
  <path d="M808,280 H672" fill="none" stroke="#2e7d32" stroke-width="2.2" marker-end="url(#g)"/>
  <text x="738" y="273" text-anchor="middle" font-size="11" fill="#2e7d32">readings</text>
  <text x="738" y="296" text-anchor="middle" font-size="10" fill="#2e7d32">every 30 s</text>
  <path d="M674,423 H870 V374" fill="none" stroke="#e65100" stroke-width="2.2" marker-end="url(#o)" marker-start="url(#o)"/>
  <text x="803" y="441" text-anchor="start" font-size="11" fill="#e65100">MQTT: status in,</text>
  <text x="803" y="456" text-anchor="start" font-size="11" fill="#e65100">current limits out</text>

  <!-- home user -->
  <rect x="810" y="470" width="120" height="62" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="870" y="496" text-anchor="middle" font-size="13" font-weight="600" fill="#222">Home user</text>
  <text x="870" y="514" text-anchor="middle" font-size="11" fill="#555">browser on home WiFi</text>
  <path d="M810,500 H795 V230 H672" fill="none" stroke="#444" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a)"/>
</svg>
