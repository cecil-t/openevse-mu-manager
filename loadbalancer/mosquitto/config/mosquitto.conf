# Mosquitto for the OpenEVSE load balancer. LAN only (the port is bound to the
# server's LAN address in docker-compose.yml; never forward 1883 on the router).
listener 1883
allow_anonymous false
password_file /mosquitto/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
max_queued_messages 200
