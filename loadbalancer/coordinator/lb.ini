; OpenEVSE load-balance coordinator settings (no secrets here: MQTT login is in ../secrets/coordinator.env)
dry_run = 1                 ; 1 = only log what it would do (the default), 0 = live. LB_DRY_RUN in ../.env overrides this.
site_dir = ""                ; the OpenEVSE site folder (openevse.db + PHP helpers), mounted read-only. Set this only if
                            ; OPENEVSE_SITE in ../.env is not passed in (docker-compose.yml passes it), e.g. "/var/www/html/openevse"
run_dir = "/run-lb"         ; heartbeat.json, state.json, coordinator.log
timezone = ""                ; set this, e.g. "America/Chicago"; blank = the site's time zone (Settings > Preferences)
poll_sec = 20               ; full web read of every unit
config_reload_sec = 60      ; re-read groups/units from openevse.db
mqtt_host = "mosquitto"
mqtt_port = 1883
mqtt_prefix = "openevse"    ; units publish to openevse/u<id>/...
